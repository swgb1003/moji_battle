# Supply the allocated app name with flyctl deploy --app <name> --ha=false.
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  HOST = "0.0.0.0"
  ALLOWED_ORIGIN = "https://moji-fighter-x.vercel.app"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
