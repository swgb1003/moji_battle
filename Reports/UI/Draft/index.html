<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOJI Fighter X — 文字ドラフト 実装画面</title>
<style>body{margin:0;background:#20211f;color:#f2ebdb;font:16px system-ui,sans-serif}header,main{max-width:1500px;margin:auto;padding:24px}header{position:sticky;top:0;background:#20211f;z-index:1}h1{margin:0 0 12px;font-size:28px}button{padding:10px 18px;margin-right:8px;border:1px solid #f2ebdb;background:transparent;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#ba3c2d}figure{margin:0 0 32px}figcaption{padding:12px 0;font-weight:600}img{width:100%;height:auto;display:block;border:1px solid #888}p{color:#c9c1b0}</style>
<header><h1>文字ドラフト — 実装画面</h1><p>Unityで実際に動かして撮影した画面です。称号の通知も実際の獲得処理によるものです。</p><nav aria-label="表示サイズ"><button data-size="" aria-pressed="true">1920 × 1080</button><button data-size="_880x450" aria-pressed="false">880 × 450</button><button data-size="_1280x960" aria-pressed="false">1280 × 960</button></nav></header>
<main id="gallery"></main>
<script>const screens=[['01_menu','01 メニュー'],['02_intro','02 ルール説明'],['03_draft','03 文字選択'],['04_build_xl','04 構成調整 — XLサイズ'],['05_vs','05 VS確認'],['06_battle','06 対戦中'],['07_round_win','07 ラウンド勝利'],['08_com_first','08 COM先攻のドラフト'],['09_round_loss','09 ラウンド敗北'],['10_final_win','10 ドラフト優勝'],['11_draw','11 引き分け'],['12_final_loss','12 ドラフト敗北'],['13_preview_extreme_grip','13 武器を端で持つプレビュー']];const gallery=document.querySelector('#gallery');for(const [file,title]of screens){const f=document.createElement('figure'),c=document.createElement('figcaption'),i=document.createElement('img');c.textContent=title;i.src=file+'.png';i.dataset.file=file;i.alt=title;i.loading='lazy';f.append(c,i);gallery.append(f)}for(const b of document.querySelectorAll('button'))b.onclick=()=>{for(const q of document.querySelectorAll('button'))q.setAttribute('aria-pressed',q===b?'true':'false');for(const i of document.querySelectorAll('img'))i.src=i.dataset.file+b.dataset.size+'.png'}</script>
</html>
